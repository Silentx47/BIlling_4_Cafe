<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Login
</title>

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Poppins', sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:
            linear-gradient(rgba(0,0,0,0.35),
            rgba(0,0,0,0.35)),
            url('coffee-shop.jpg');
        background-size:cover;
        background-position:center;
        overflow:hidden;
    }

    /* Login Card */
    .login-container{
        width:420px;
        padding:40px;
        border-radius:30px;

        /* Glassmorphism */
        background:rgba(255,255,255,0.15);
        backdrop-filter:blur(18px);
        -webkit-backdrop-filter:blur(18px);

        border:1px solid rgba(255,255,255,0.25);

        box-shadow:
            0 8px 32px rgba(0,0,0,0.25);

        color:white;
    }

    .logo{
        text-align:center;
        margin-bottom:10px;
        color:#9acc64;
        font-size:32px;
    }

    h1{
        text-align:center;
        margin-bottom:10px;
        font-size:40px;
        font-family:Georgia, serif;
    }

    .subtitle{
        text-align:center;
        margin-bottom:35px;
        color:#f0f0f0;
    }

    .input-box{
        position:relative;
        margin-bottom:25px;
    }

    .input-box input{
        width:100%;
        padding:18px 50px;
        border:none;
        outline:none;
        border-radius:15px;

        background:rgba(255,255,255,0.2);
        color:white;
        font-size:16px;
    }

    .input-box input::placeholder{
        color:rgba(255,255,255,0.8);
    }

    .input-box i{
        position:absolute;
        top:50%;
        transform:translateY(-50%);
        color:white;
    }

    .input-box .left-icon{
        left:18px;
    }

    .input-box .right-icon{
        right:18px;
        cursor:pointer;
    }

    .options{
        display:flex;
        justify-content:space-between;
        margin-bottom:25px;
        font-size:14px;
    }

    .options a{
        color:#9acc64;
        text-decoration:none;
    }

    .options a:hover{
        text-decoration:underline;
    }

    .login-btn{
        width:100%;
        padding:16px;
        border:none;
        border-radius:15px;
        background:#9acc64;
        color:white;
        font-size:18px;
        font-weight:600;
        cursor:pointer;
        transition:0.3s;
    }

    .login-btn:hover{
        background:#a9e376;
        transform:translateY(-3px);
    }

    .divider{
        text-align:center;
        margin:30px 0;
        color:#eee;
    }

    .signup-btn{
        width:100%;
        padding:16px;
        border:none;
        border-radius:15px;

        background:rgba(255,255,255,0.2);
        color:white;
        cursor:pointer;
        font-size:16px;
    }

    .footer{
        text-align:center;
        margin-top:25px;
        font-size:13px;
        color:#ddd;
    }

    @media(max-width:500px){
        .login-container{
            width:90%;
            padding:30px 25px;
        }

        h1{
            font-size:32px;
        }
    }

</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <i class="fa-solid fa-mug-hot"></i>
    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Login to continue to your Cafe Account
    </p>

    <form method="POST" action="/">

        <div class="input-box">
        <i class="fa-solid fa-user left-icon"></i>
        <input type="text" name="username" placeholder="Username">
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock left-icon"></i>
        <input type="password" name="password" placeholder="Password" id="password">
        <i class="fa-solid fa-eye right-icon" onclick="togglePassword()"></i>
    </div>


        <div class="options">

            <label>
                <input type="checkbox">
                Remember me
            </label>


        </div>

        <button class="login-btn" type="submit">
            Login
        </button>

    </form>


    <div class="footer">
        © 2026 E-Store. All rights reserved.
    </div>

</div>

<script>

function togglePassword(){

    const password =
    document.getElementById("password");

    if(password.type === "password"){
        password.type = "text";
    }
    else{
        password.type = "password";
    }

}

</script>

</body>
</html>
